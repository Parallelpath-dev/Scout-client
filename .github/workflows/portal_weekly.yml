name: Portal weekly

# This pipeline collects its own ads. It does not wait for, read from, or depend on
# the internal tool in parallelpath-dev/scout.
#
# Bouldering Project's competitors live in portal.competitors and portal.channels,
# which the internal pipeline cannot see, so these five pages are pulled exactly once
# a week by exactly one codebase. Changing a cap, adding a competitor or retiring a
# channel is a change in this repo and nothing else.
#
# Monday 08:00 UTC is chosen for no reason other than being Monday morning. There is
# no ordering constraint to respect.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      client_slug:
        description: 'Client slug to run'
        required: false
        default: 'bouldering-project'
      week:
        description: 'ISO date inside the target week (blank = this week)'
        required: false
        default: ''
      dry_run:
        description: 'Classify and print, write nothing'
        type: boolean
        required: false
        default: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # Runs before anything touches the database. The classifier's vocabulary is the
      # part that churns, and a bad edit to geo_terms.json is silent: it does not raise,
      # it just quietly mislabels a week. These fixtures are the only thing standing
      # between a typo and a number on a client's dashboard.
      - name: Test the geo classifier
        run: cd pipeline && python3 test_geo.py

      - name: Collect and classify Meta ads
        run: |
          ARGS="--client ${{ github.event.inputs.client_slug || 'bouldering-project' }}"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          cd pipeline && python3 classify_meta_ads.py $ARGS
