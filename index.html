<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   Scout Client Portal
   Every token below is a FALLBACK. On load, the client's theme record
   overwrites these on :root, which is what makes a new client a database
   row rather than a fork of this file.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#2A2724;
  --surface:#332F2B;
  --sunk:#221F1D;
  --ink:#F4F1ED;
  --muted:#A49C93;
  --line:rgba(244,241,237,0.13);
  --birch:#8A8078;
  --accent:#C7643F;
  --accent-soft:rgba(199,100,63,0.14);
  --ok:#8FA8B8;
  --wait:#C7643F;
  --font-display:'Archivo',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius:10px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em}

/* ── LOGIN ────────────────────────────────────────────────────────── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:430px}
.login-mark{font-size:52px;line-height:1;margin:14px 0 6px}
.login-rule{height:3px;width:56px;background:var(--accent);margin:22px 0 26px}
.login-lede{color:var(--muted);margin-bottom:28px;max-width:36ch}
label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=email]{
  width:100%;padding:13px 15px;font-family:var(--font-body);font-size:15px;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);
}
input[type=email]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
button{
  font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.01em;
  padding:13px 22px;border:none;border-radius:var(--radius);cursor:pointer;
  background:var(--ink);color:var(--ground);transition:opacity .15s ease;
}
button:hover{opacity:.86}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:12px;align-items:center;margin-top:18px}
.msg{margin-top:20px;padding:14px 16px;border-radius:var(--radius);font-size:14px;
  border:1px solid var(--line);background:var(--surface)}
.msg.ok{border-left:3px solid var(--ok)}
.msg.err{border-left:3px solid #B3261E}
.login-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}

/* ── APP SHELL ────────────────────────────────────────────────────── */
#app{display:none;grid-template-columns:246px 1fr;min-height:100vh}
#app.on{display:grid}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  padding:26px 20px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:26px;overflow-y:auto;
}
.rail-mark{font-size:23px}
.rail-by{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:3px}
.rail-client{padding:13px 14px;background:var(--sunk);border-radius:var(--radius)}
.rail-client .nm{font-family:var(--font-display);font-weight:700;font-size:14px;margin-top:3px}
/* Logo presentation is theme-driven, because clients hand over wildly
   different assets. A dark circular badge needs clipping and a ring; a black
   wordmark on transparency needs a light backdrop or it vanishes on a dark
   ground. Both are config, not code:
     logoRadius   '50%' for a badge, '4px' for a wordmark
     logoBackdrop '#FFFFFF' when the mark is dark on transparency
     logoWidth    e.g. '120px' for a wide wordmark */
.rail-client img{
  width:var(--logo-width,58px);height:var(--logo-height,58px);
  object-fit:contain;display:block;margin:0 0 12px;
  border-radius:var(--logo-radius,50%);
  background:var(--logo-backdrop,transparent);
  padding:var(--logo-pad,0);
  box-shadow:0 0 0 1px var(--logo-ring,transparent);
}
nav{display:flex;flex-direction:column;gap:1px}
.nav-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:0 0 9px 12px}
.nav-i{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px;border-radius:8px;font-size:14px;color:var(--muted);
  cursor:pointer;user-select:none;border:none;background:none;width:100%;
  font-family:var(--font-body);text-align:left;
}
.nav-i:hover{background:var(--sunk);color:var(--ink)}
.nav-i[aria-current=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-i .pend{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.rail-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
.rail-foot .eyebrow{overflow-wrap:anywhere;font-size:10px;line-height:1.6;letter-spacing:.08em}
.linkish{background:none;border:none;padding:0;color:var(--muted);font-size:13px;
  font-family:var(--font-body);cursor:pointer;text-decoration:underline}
.linkish:hover{color:var(--ink)}

main{overflow-y:auto}
.bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:19px 34px;border-bottom:1px solid var(--line);
  background:var(--ground);position:sticky;top:0;z-index:10;
}
.bar h1{font-family:var(--font-display);font-size:15px;font-weight:600}
.chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);background:var(--surface);
  padding:5px 11px;border-radius:99px;white-space:nowrap}
.panel{display:none;padding:34px;max-width:1080px}
.panel.on{display:block}
/* An embedded analysis brings its own layout. Give it the full width and
   let it scroll inside its own frame rather than fighting the panel. */
.panel.embed{padding:20px 24px;max-width:none}
.panel.embed iframe{width:100%;height:calc(100vh - 120px);border:none;
  display:block;background:transparent}

/* ── SIGNATURE: the route card ────────────────────────────────────────
   A climbing project is a route you're working, not one you've failed.
   The setup state says exactly that, and it puts the one thing we're
   waiting on where they see it every time they sign in. ───────────── */
.route{
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--radius);
  padding:28px 30px;margin-bottom:36px;
}
.route h2{font-family:var(--font-display);font-size:24px;font-weight:700;
  letter-spacing:-.02em;margin:9px 0 8px}
.route p.lede{color:var(--muted);max-width:62ch}
.steps{list-style:none;margin-top:26px;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:16px;align-items:start;
  padding:16px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none;padding-bottom:2px}
.step .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:2px}
.step .t{font-family:var(--font-display);font-weight:600;font-size:15px}
.step .d{color:var(--muted);font-size:14px;margin-top:2px;max-width:56ch}
/* The proposed competitive set, shown inside step 03 while it awaits
   sign-off. Data lives on the client record, not in this file. */
.prop{list-style:none;margin:13px 0 0;border-top:1px solid var(--line)}
.prop li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line)}
.prop li:last-child{border-bottom:none;padding-bottom:0}
.prop .nm{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--ink)}
.prop .wh{color:var(--muted);font-size:12.5px;margin-top:1px}
.prop .mins{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;
  color:var(--muted);white-space:nowrap;text-align:right}
.prop-cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-top:14px}
@media(max-width:640px){.prop li{grid-template-columns:1fr}.prop .mins{text-align:left}}
.state{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.state.done{color:var(--ok);border-color:color-mix(in srgb,currentColor 38%,transparent);
  background:color-mix(in srgb,currentColor 9%,transparent)}
.state.wait{color:var(--wait);border-color:color-mix(in srgb,currentColor 42%,transparent);
  background:color-mix(in srgb,currentColor 11%,transparent)}
/* Scheduled ≠ blocked. Only the accent state should pull the eye, and only
   when the thing it marks is something the client has to do. */
.state.sched{color:var(--muted);border-color:color-mix(in srgb,currentColor 30%,transparent);
  background:transparent}

.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}
.sec-h h3{font-family:var(--font-display);font-size:13px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase}
.sec-h span{font-size:13px;color:var(--muted)}
.hold{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px;display:flex;gap:16px;align-items:flex-start;
}
.hold .dot{width:9px;height:9px;border-radius:50%;background:var(--birch);margin-top:6px;flex:none}
.hold .h{font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:4px}
.hold .b{color:var(--muted);font-size:14px;max-width:60ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}

@media (max-width:820px){
  #app.on{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column}
  nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav-h{flex:1 1 100%;margin:0 0 2px 0}
  .nav-i{width:auto}
  .panel,.bar{padding-left:20px;padding-right:20px}
  .login-mark{font-size:42px}
  .route{padding:22px 20px}
}
@media (max-width:640px){
  /* Three columns can't hold a sentence on a phone. Reflow to two rows:
     marker and status on top, the actual content full width beneath. */
  .step{display:flex;flex-wrap:wrap;align-items:center;gap:9px 10px}
  .step .n{order:1;padding-top:0}
  .step .state{order:2;margin-left:auto}
  .step > div{order:3;flex:1 1 100%}
  .step .d{max-width:none}
  .sec-h{flex-direction:column;gap:3px}
}

/* ── BRIEFING ─────────────────────────────────────────────────────────
   Everything below renders portal.briefings as written by the pipeline.
   The page adds no numbers of its own: every figure on screen is a field
   in the row, so what the client reads is exactly what passed review. */
.hero{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:26px 30px;margin-bottom:30px}
.hero .big{font-family:var(--font-display);font-size:64px;font-weight:800;line-height:1;
  letter-spacing:-.04em}
.hero .of{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:6px}
.hero .word{font-family:var(--font-display);font-weight:600;font-size:17px;margin:6px 0 4px}
.hero .cap{color:var(--muted);font-size:13.5px;max-width:58ch}
.hero .drv{margin-top:10px;font-size:14px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.meter .l{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);display:flex;justify-content:space-between}
.meter .t{height:6px;border-radius:3px;background:var(--sunk);margin-top:6px;position:relative;overflow:hidden}
.meter .f{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--birch)}
.meter .f.hi{background:var(--accent)}
.meter .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.6}
.summary{font-size:17px;line-height:1.6;max-width:70ch;margin-bottom:34px}
.devs{display:flex;flex-direction:column;gap:16px}
.dev{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 26px}
.dev h4{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:6px 0 8px}
.dev .sw{font-size:15px;max-width:68ch}
.dev dl{display:grid;grid-template-columns:130px 1fr;gap:10px 18px;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--line)}
.dev dt{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding-top:3px}
.dev dd{font-size:14.5px;max-width:64ch}
.dev dd.rec{color:var(--ink);font-weight:500}
.dev .cav{margin-top:12px;font-size:13px;color:var(--muted)}
.dev .src{display:inline-block;margin-top:12px;font-family:var(--font-mono);font-size:11px;
  letter-spacing:.06em}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.scores{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.scores th{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:500;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.scores td{padding:12px 14px;border-bottom:1px solid var(--line)}
.scores tr:last-child td{border-bottom:none}
.scores td.nm{font-family:var(--font-display);font-weight:600}
.scores td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.scores td.n.hi{color:var(--accent);font-weight:600}
.scores td.na{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.fine{color:var(--muted);font-size:12.5px;margin-top:10px;max-width:80ch}
.items{list-style:none;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.items li{padding:16px 20px;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:none}
.items .it{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.items .it b{font-family:var(--font-display);font-weight:600;font-size:15px}
.items .it .chip{padding:3px 9px}
.items p{color:var(--ink);font-size:14.5px;margin-top:5px;max-width:74ch}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;color:var(--muted);font-size:14px}
.cover{list-style:none;display:flex;flex-direction:column;gap:8px}
.cover li{color:var(--muted);font-size:13.5px;padding-left:16px;position:relative;max-width:78ch}
.cover li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--birch)}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;gap:14px;padding:22px 20px}
  .dev{padding:20px}
  .dev dl{grid-template-columns:1fr;gap:4px}
  .dev dd{margin-bottom:8px}
}

/* Competitor series. Fixed order (alphabetical by name), never by rank, so a
   competitor keeps its colour on every chart. Validated as a set against the
   dark surface (dataviz validator, 24 Sep 2026): CVD ΔE ≥ 8.4, normal ≥ 19.3.
   Contrast sits under 3:1, so every chart carries a legend, direct labels and
   a table view: colour is never the only way to tell series apart. */
:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 12px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
/* On a phone a chart keeps a readable size and scrolls inside its card. */
@media (max-width:640px){.chart{overflow-x:auto}.chart svg{min-width:600px}.tip{display:none}}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.chart .lbl{fill:var(--ink);font-family:var(--font-body);font-size:11.5px}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .xh{stroke:var(--muted);stroke-width:1;opacity:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--sunk);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;font-size:12px;min-width:130px;opacity:0;transition:opacity .08s;z-index:5}
.tip b{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:14px}
.tip div strong{font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
details.tv{margin-top:10px}
details.tv summary{cursor:pointer;color:var(--muted);font-size:12.5px}
details.tv table{margin-top:8px}
.campaign{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:18px 22px}
.campaign + .campaign{margin-top:12px}
.campaign .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.campaign h4{font-family:var(--font-display);font-size:16px;font-weight:700}
.campaign ul{margin:10px 0 0 18px;color:var(--ink);font-size:14px}
.campaign li{margin:3px 0}
.kw td.me{background:var(--accent-soft)}
.kw th.me{color:var(--accent)}
.kw td.p1{font-weight:700;color:var(--ink)}
.kw td.p2{color:var(--ink)}
.kw td.p3{color:var(--muted)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card .who{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .who b{font-family:var(--font-display);font-size:14px}
.card .dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.card .ttl{font-family:var(--font-display);font-weight:600;font-size:14px}
.card .txt{font-size:13.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;
  -webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;
  display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.key p{max-width:72ch;margin-bottom:12px}
.bands{list-style:none;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.bands li{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bands li:last-child{border-bottom:none}
.bands b{font-family:var(--font-mono);font-size:12px}

/* Recommendations close every tab: the part of the dashboard a reader acts on. */
.recs{display:flex;flex-direction:column;gap:12px}
.rec-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:18px 22px}
.rec-card .obs{font-size:13px;color:var(--muted);max-width:72ch}
.rec-card .act{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.4;
  margin:6px 0 6px;max-width:70ch}
.rec-card .why{font-size:14px;max-width:72ch}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<section id="login">
  <div class="login-card">
    <p class="eyebrow">Competitive intelligence</p>
    <p class="wordmark login-mark">Scout</p>
    <p class="eyebrow">by Parallel Path</p>
    <div class="login-rule"></div>

function applyTheme(theme){
  if(!theme || typeof theme !== 'object') return;
  const MAP = {
    ground:'--ground', surface:'--surface', sunk:'--sunk', ink:'--ink',
    muted:'--muted', line:'--line', birch:'--birch', accent:'--accent',
    accentSoft:'--accent-soft', ok:'--ok', wait:'--wait',
    logoRadius:'--logo-radius', logoBackdrop:'--logo-backdrop',
    logoWidth:'--logo-width', logoHeight:'--logo-height', logoPad:'--logo-pad',
    logoRing:'--logo-ring',
    fontDisplay:'--font-display', fontBody:'--font-body',
    fontMono:'--font-mono', radius:'--radius',
  };
  for(const [k, v] of Object.entries(MAP)){
    if(theme[k]) document.documentElement.style.setProperty(v, theme[k]);
  }
  if(theme.fontImport){
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = theme.fontImport;

}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#login').style.display='grid'; return; }

  /* One query, no client identifier sent. Row level security returns this
     user's client and nothing else — there is no parameter here for anyone
     to tamper with. */
  const { data:clients, error } = await sb
    .from('clients')
    .select('id,name,slug,theme,config,brain')
    .limit(1);

  if(error || !clients || clients.length === 0){
    $('#login').style.display='grid';
    note("You're signed in, but we haven't attached a dashboard to this account yet. Reply to your invitation and we'll finish the setup.",'err');
    return;
  }

  const client = clients[0];
  applyTheme(client.theme);

  /* Competitive data lives in the `portal` schema, not `public`. `public` is the
     internal tool's working set and this page is never pointed at it. `clients`
     above is the one exception: the client record, theme and config are shared,
     and row level security returns only this user's row.

     Row level security on portal.* resolves membership through public.client_users
     exactly as it does here, so this changes where the data comes from and not who
     can see it. */
  const portal = sb.schema('portal');

  const [{ count:compCount }, { data:briefs }] = await Promise.all([
    portal.from('competitors').select('id',{ count:'exact', head:true }),
    portal.from('briefings')
      .select('id,week_of,pressure_score,summary,developments,full_report')
      .order('week_of',{ ascending:false }).limit(1),
  ]);

  const latest = (briefs && briefs[0]) || null;
  /* The charts read the same week's collected data the briefing was written
     from, through the same row level security. Nothing here is required: a
     failed read leaves that chart with an honest empty state. */
  if(latest) latest._ctx = await loadContext(portal, latest.week_of);
  render(client, session, compCount || 0, latest);
}

async function loadContext(portal, week){
  const q = async p => { try { const { data, error } = await p; return error ? [] : (data || []); } catch(e){ return []; } };
  const [competitors, channels, pressure, profiles, ads, posts, kws, geo] = await Promise.all([
    q(portal.from('competitors').select('id,name')),
    q(portal.from('channels').select('id,competitor_id,platform,scope,handle')),
    q(portal.from('pressure_weekly').select('week_of,competitor_id,score,status,method').order('week_of')),
    q(portal.from('signals').select('week_of,competitor_id,channel_id,platform:data->>platform,followers:data->>followers,posts:data->>posts_in_week,eng:data->>avg_engagement,capped:data->>capped')
        .eq('signal_type','social_profile').order('week_of').limit(2000)),
    q(portal.from('signals').select('id,competitor_id,geo_relevance,source_url,body:data->>body,title:data->>title,start:data->>start_date,format:data->>display_format,cta:data->>cta_text,recruit:data->>is_recruitment,scanned:data->text_scanned')
        .eq('signal_type','ad_active').eq('week_of', week).gte('data->>start_date', addDays(week, -7)).limit(3000)),
    q(portal.from('signals').select('id,competitor_id,channel_id,source_url,text:data->>text,platform:data->>platform,posted:data->>posted_at,likes:data->>likes,comments:data->>comments')
        .eq('signal_type','social_post').eq('week_of', week).limit(500)),
    q(portal.from('signals').select('competitor_id,signal_type,keywords:data->keywords')
        .in('signal_type',['tracked_keyword_positions','client_keyword_positions']).eq('week_of', week)),
    q(portal.from('ad_geo_weekly').select('competitor_id,week_of,total_available,dc_landing,dc_explicit,regional,other_market').order('week_of')),
  ]);
  const names = Object.fromEntries(competitors.map(c => [c.id, c.name]));
  const order = competitors.map(c => c.name).sort((a, b) => a.localeCompare(b));
  const color = Object.fromEntries(order.map((n, i) => [n, `var(--s${(i % 5) + 1})`]));
  return { week, competitors, channels, pressure, profiles, ads, posts, kws, geo, names, order, color };
}

/* Line chart, one shared y axis. series: [{name, color, values:[n|null]}].
   Hover anywhere on the plot for every series at that week. */
let CHART_SEQ = 0;
function lineChart({ labels, series, yMax, ref, yLabel }){
  const id = 'c' + (++CHART_SEQ);
  const W = 720, H = 240, L = 34, R = 92, T = 12, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const top = yMax || Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null)));
  const niceTop = top <= 10 ? Math.ceil(top) : Math.ceil(top / 5) * 5;
  const x = i => L + (labels.length === 1 ? pw / 2 : (i * pw) / (labels.length - 1));
  const y = v => T + ph - (v / niceTop) * ph;
  const ticks = [0, niceTop / 2, niceTop].map(v => Math.round(v * 10) / 10);
  const ends = [];
  const paths = series.map(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if(v == null){ pen = false; return; }
      d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; });
    const lastI = s.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    const dots = s.values.map((v, i) => v == null ? '' :
      `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === lastI ? 4 : 2.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    if(lastI != null) ends.push({ x: x(lastI) + 8, y: y(s.values[lastI]) + 4, t: `${s.name} ${s.values[lastI]}` });
    return `<path class="ln" d="${d}" stroke="${s.color}"/>${dots}`;
  }).join('');
  /* Direct labels at the line ends, pushed apart so two lines ending on the same
     value never print on top of each other. */
  ends.sort((a, b) => a.y - b.y);
  for(let i = 1; i < ends.length; i++) if(ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
  const labelsSvg = ends.map(e => `<text class="lbl" x="${e.x.toFixed(1)}" y="${e.y.toFixed(1)}">${esc(e.t)}</text>`).join('');
  const step = Math.max(1, Math.ceil(labels.length / 7));
  const xl = labels.map((l, i) => (i % step === 0 || i === labels.length - 1)
    ? `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>` : '').join('');
  const hits = labels.map((l, i) => {
    const w = labels.length === 1 ? pw : pw / (labels.length - 1);
    return `<rect class="hit" data-i="${i}" x="${(x(i) - w / 2).toFixed(1)}" y="${T}" width="${w.toFixed(1)}" height="${ph}"/>`;
  }).join('');
  const data = JSON.stringify({ labels, series: series.map(s => ({ n: s.name, c: s.color, v: s.values })) });
  return `<div class="chart" id="${id}" data-chart='${esc(data)}'>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yLabel || 'Chart')}">
      ${ticks.map(t => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
      ${ref != null ? `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}"/>` : ''}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ph}"/>
      ${paths}${labelsSvg}${xl}${hits}
    </svg><div class="tip"></div></div>`;
}

/* Horizontal bars. rows: [{name, color, parts:[{label, value, shade}]}]. One
   scale across rows; a 2px surface gap between stacked parts. */
function barChart(rows, { unit }){
  const id = 'c' + (++CHART_SEQ);
  const W = 720, rowH = 30, L = 96, R = 60, T = 4;
  const H = T + rows.length * rowH + 4;
  const max = Math.max(1, ...rows.map(r => r.parts.reduce((a, p) => a + (p.value || 0), 0)));
  const sx = v => (v / max) * (W - L - R);
  const body = rows.map((r, i) => {
    let at = L; const yy = T + i * rowH + 7;
    const total = r.parts.reduce((a, p) => a + (p.value || 0), 0);
    const segs = r.parts.filter(p => p.value > 0).map(p => {
      const w = Math.max(2, sx(p.value) - 2);
      const seg = `<rect x="${at.toFixed(1)}" y="${yy}" width="${w.toFixed(1)}" height="16" rx="3" fill="${r.color}" opacity="${p.shade ?? 1}"><title>${esc(r.name)} · ${esc(p.label)}: ${p.value}</title></rect>`;
      at += sx(p.value); return seg; }).join('');
    return `<text class="lbl" x="${L - 10}" y="${yy + 12}" text-anchor="end">${esc(r.name)}</text>${segs}
      <text x="${(at + 8).toFixed(1)}" y="${yy + 12}">${total}${unit ? ' ' + esc(unit) : ''}</text>`;
  }).join('');
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img">${body}</svg></div>`;
}

function wireCharts(root){
  root.querySelectorAll('.chart[data-chart]').forEach(el => {
    if(el._wired) return; el._wired = true;
    let d; try { d = JSON.parse(el.dataset.chart); } catch(e){ return; }
    const tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), svg = el.querySelector('svg');
    const show = (rect) => {
      const i = +rect.dataset.i;
      const cx = +rect.getAttribute('x') + +rect.getAttribute('width') / 2;
      xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.style.opacity = .6;
      tip.textContent = '';
      const b = document.createElement('b'); b.textContent = d.labels[i]; tip.appendChild(b);
      d.series.forEach(s => { const row = document.createElement('div'); const l = document.createElement('span');
        const sw = document.createElement('i'); sw.style.background = s.c; l.appendChild(sw); l.appendChild(document.createTextNode(s.n));
        const v = document.createElement('strong'); v.textContent = s.v[i] == null ? '—' : s.v[i];
        row.appendChild(l); row.appendChild(v); tip.appendChild(row); });
      const box = svg.getBoundingClientRect(), host = el.getBoundingClientRect();
      const px = (cx / svg.viewBox.baseVal.width) * box.width + (box.left - host.left);
      tip.style.left = Math.min(host.width - 160, Math.max(8, px + 12)) + 'px'; tip.style.top = '14px'; tip.style.opacity = 1;
    };
    el.querySelectorAll('.hit').forEach(r => {
      r.addEventListener('pointermove', () => show(r));
      r.addEventListener('pointerleave', () => { tip.style.opacity = 0; xh.style.opacity = 0; });
    });
  });
}

}

/* Coordinated campaign signals, the internal tool's rule: one theme showing up on two or
   more channels in the same week. The Analyst names the theme and cites the signals;
   the pipeline keeps it only if those signals span two channels. The page adds each
   channel's activity score as context, so "a campaign" and "a busy week" read apart. */
function campaigns(b){
  const fr = b.full_report || {};
  const list = (((fr.sections || {}).overview || {}).campaign_signals || []).filter(x => x && x.theme);
  const comps = (fr.pressure || {}).competitors || [];
  const label = { paid:'Paid', social:'Social', web:'Website', email:'Email' };
  const body = list.length ? list.map(x => {
    const c = comps.find(k => k.competitor === x.competitor) || {};
    const act = (x.channels || []).map(ch => { const k = (c.components || {})[ch];
      return k && typeof k.score === 'number' ? `${label[ch] || ch} ${k.score}` : label[ch] || ch; });
    return `<div class="campaign"><div class="top">
        <h4>${esc(x.competitor)}: ${esc(x.theme)}</h4>
        <span class="chip">${esc(x.confidence === 'high' ? 'High' : 'Medium')} confidence · ${(x.channels || []).length} channels</span></div>
      ${Array.isArray(x.evidence) && x.evidence.length ? `<ul>${x.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
      ${act.length ? `<p class="fine" style="margin-top:10px">Activity this week: ${esc(act.join(' · '))}. 50 is a normal week.</p>` : ''}
    </div>`;
  }).join('') : empty('No coordinated campaign this week. Scout flags a competitor when the same theme shows up on two or more of paid, social, website and email in the same week.');
  return sec('Coordinated campaign signals', '', body);
}

function pressureTrend(ctx){
  const rows = (ctx.pressure || []).filter(r => r.competitor_id == null);
  if(rows.filter(r => r.score != null).length < 2) return '';

  const note = v2 > 0 ? `Before ${fmtDate(rows[v2].week_of)} the score measured organic social only. Paid, search and website count from ${fmtDate(rows[v2].week_of)}.` : '';

/* ── Search ── */
function keywordGrid(ctx){
  const kws = ctx.kws || [];
  const mine = kws.find(k => k.signal_type === 'client_keyword_positions');
  const theirs = kws.filter(k => k.signal_type === 'tracked_keyword_positions' && ctx.names[k.competitor_id]);
  if(!mine && !theirs.length) return sec('Keyword positions', '', empty('Keyword tracking has not reported for this week.'));
  const rowsBy = {};
  const add = (who, list) => (Array.isArray(list) ? list : []).forEach(k => {
    if(!k || !k.keyword) return;
    (rowsBy[k.keyword] ||= { vol: k.volume ?? null, pos: {} }).pos[who] = k.position ?? null;
    if(rowsBy[k.keyword].vol == null && k.volume != null) rowsBy[k.keyword].vol = k.volume;
  });
  const me = 'You';
  if(mine) add(me, mine.keywords);
  const comps = ctx.order.filter(n => theirs.some(t => ctx.names[t.competitor_id] === n));
  theirs.forEach(t => add(ctx.names[t.competitor_id], t.keywords));
  const cols = [me, ...comps];
  const rows = Object.entries(rowsBy).sort((a, b) => (b[1].vol || 0) - (a[1].vol || 0));
  const cls = p => p == null ? 'na' : p <= 5 ? 'p1' : p <= 10 ? 'p2' : 'p3';
  return sec('Keyword positions', 'Google rank in DC · lower is better · — means not in the top 100',
    `<div class="tbl-wrap"><table class="scores kw">
      <thead><tr><th>Keyword</th><th>DC searches / mo</th>${cols.map(c => `<th class="${c === me ? 'me' : ''}">${esc(c === me ? 'Bouldering Project' : c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(([kw, r]) => `<tr><td class="nm">${esc(kw)}</td><td class="n">${fmtN(r.vol)}</td>
        ${cols.map(c => { const p = r.pos[c]; return `<td class="n ${cls(p)}${c === me ? ' me' : ''}">${p ?? '—'}</td>`; }).join('')}</tr>`).join('')}</tbody>
    </table></div><p class="fine">Search volumes are Semrush estimates for Washington, DC.</p>`);
}

/* ── Paid ── */
function paidCharts(ctx){
  const wk = ctx.week, from = addDays(wk, -7);
  const latest = (ctx.geo || []).filter(g => String(g.week_of).slice(0,10) === String(wk).slice(0,10));
  const out = [];
  if(latest.length){
    const rows = ctx.order.map(n => {
      const g = latest.find(x => ctx.names[x.competitor_id] === n); if(!g) return null;
      const dc = (g.dc_landing || 0) + (g.dc_explicit || 0), reg = g.regional || 0, oth = g.other_market || 0;
      const rest = Math.max(0, (g.total_available || 0) - dc - reg - oth);
      return { name:n, color:ctx.color[n], parts:[{label:'Names DC', value:dc, shade:1},{label:'Names the region', value:reg, shade:.7},{label:'Names no place', value:rest, shade:.4},{label:'Names another market', value:oth, shade:.18}] };
    }).filter(Boolean);
    out.push(sec('Ads running now', 'Meta Ad Library, full census',
      `<div class="legend"><span><i style="background:var(--ink);opacity:1"></i>Names DC</span><span><i style="background:var(--ink);opacity:.7"></i>Names the region</span><span><i style="background:var(--ink);opacity:.4"></i>Names no place</span><span><i style="background:var(--ink);opacity:.18"></i>Names another market</span></div>`
      + barChart(rows, { unit:'ads' })
      + `<p class="fine">DC counts are a floor. Meta publishes no targeting data, so an ad that names no place may still run here.</p>`
      + tableView(['Competitor','Names DC','Region','No place','Other market','Total'], rows.map(r => [r.name, ...r.parts.map(p => p.value), r.parts.reduce((a,p)=>a+p.value,0)]))));
  }
  const acq = (ctx.ads || []).filter(a => String(a.recruit) !== 'true');
  const fresh = acq.filter(a => a.start && String(a.start).slice(0,10) >= from);
  const byComp = {};
  fresh.forEach(a => { const n = ctx.names[a.competitor_id]; if(!n) return;
    const m = (byComp[n] ||= {}); const k = msgKey(a); (m[k] ||= { ad:a, ids:0 }).ids++; });
  const launchRows = ctx.order.map(n => ({ name:n, color:ctx.color[n], parts:[{ label:'New messages', value:Object.keys(byComp[n] || {}).length }] }));
  out.push(sec('New ad messages this week', `started ${fmtDate(from)} or later`,
    barChart(launchRows, { unit:'' }) + `<p class="fine">Counted by message, not ad ID: Meta files one message under many IDs.</p>`));
  const cards = ctx.order.flatMap(n => Object.values(byComp[n] || {}).map(x => ({ n, ...x })));
  out.push(sec('Active ad intelligence', `${cards.length} new message${cards.length === 1 ? '' : 's'}`,
    cards.length ? `<div class="feed">${cards.map(({ n, ad, ids }) => { const u = safeUrl(ad.source_url); return `
      <div class="card"><div class="who"><b><span class="dot" style="background:${ctx.color[n]}"></span>${esc(n)}</b>${ad.format ? `<span class="chip">${esc(ad.format)}</span>` : ''}</div>
        ${(ad.title || (ad.scanned || {}).card0_title) ? `<div class="ttl">${esc(ad.title || ad.scanned.card0_title)}</div>` : ''}
        ${(ad.body || (ad.scanned || {}).card0_body) ? `<div class="txt">${esc(ad.body || ad.scanned.card0_body)}</div>` : ''}
        <div class="meta"><span>Started ${esc(fmtDate(ad.start))}</span>${ad.cta ? `<span>${esc(ad.cta)}</span>` : ''}${ids > 1 ? `<span>${ids} ad IDs</span>` : ''}${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Ad Library ↗</a>` : ''}</div>
      </div>`; }).join('')}</div>` : empty('No new ad messages this week.')));
  out.push(sec('Paid keyword trend', 'Semrush estimate, directional',
    empty('The trend starts with the second weekly reading on 28 Sep. Semrush models paid keywords from its own crawl, so read it for direction, never as a count of what anyone bids on.')));
  return out.join('');
}

  const notes = (SECTION_KEYS[id] || []).map(([k, l]) => itemsBlock(k, l, sections[k])).join('');
  if(id === 'overview') return overviewPanel(b);
  const recs = recsBlock(id, sections.recommendations);
  if(id === 'search') return keywordGrid(ctx) + notes + recs;
  if(id === 'paid') return paidCharts(ctx) + notes + recs;
  if(id === 'social') return socialCharts(ctx) + notes + recs;
  if(id === 'owned') return notes + recs;
  if(id === 'key') return keyPanel();
  return empty('Nothing to show here yet.');
}

sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_IN') boot();
});
boot();
</script>
</body>
