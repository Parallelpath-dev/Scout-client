<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   Scout Client Portal
   Every token below is a FALLBACK. On load, the client's theme record
   overwrites these on :root, which is what makes a new client a database
   row rather than a fork of this file.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --ground:#2A2724;
  --surface:#332F2B;
  --sunk:#221F1D;
  --ink:#F4F1ED;
  --muted:#A49C93;
  --line:rgba(244,241,237,0.13);
  --birch:#8A8078;
  --accent:#C7643F;
  --accent-soft:rgba(199,100,63,0.14);
  --ok:#8FA8B8;
  --wait:#C7643F;
  --font-display:'Archivo',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius:10px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{
  font-family:var(--font-mono);font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.03em}

/* ── LOGIN ────────────────────────────────────────────────────────── */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:430px}
.login-mark{font-size:52px;line-height:1;margin:14px 0 6px}
.login-rule{height:3px;width:56px;background:var(--accent);margin:22px 0 26px}
.login-lede{color:var(--muted);margin-bottom:28px;max-width:36ch}
label{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=email]{
  width:100%;padding:13px 15px;font-family:var(--font-body);font-size:15px;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--radius);
}
input[type=email]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
button{
  font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.01em;
  padding:13px 22px;border:none;border-radius:var(--radius);cursor:pointer;
  background:var(--ink);color:var(--ground);transition:opacity .15s ease;
}
button:hover{opacity:.86}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:12px;align-items:center;margin-top:18px}
.msg{margin-top:20px;padding:14px 16px;border-radius:var(--radius);font-size:14px;
  border:1px solid var(--line);background:var(--surface)}
.msg.ok{border-left:3px solid var(--ok)}
.msg.err{border-left:3px solid #B3261E}
.login-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}

/* ── APP SHELL ────────────────────────────────────────────────────── */
#app{display:none;grid-template-columns:246px 1fr;min-height:100vh}
#app.on{display:grid}
.rail{
  background:var(--surface);border-right:1px solid var(--line);
  padding:26px 20px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:26px;overflow-y:auto;
}
.rail-mark{font-size:23px}
.rail-by{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:3px}
.rail-client{padding:13px 14px;background:var(--sunk);border-radius:var(--radius)}
.rail-client .nm{font-family:var(--font-display);font-weight:700;font-size:14px;margin-top:3px}
/* Their mark is a dark disc on a white JPEG. Clipping to a circle drops the
   white corners, and the hairline ring keeps it off the near-matching ground. */
.rail-client img{width:58px;height:58px;border-radius:50%;display:block;
  margin:0 0 12px;box-shadow:0 0 0 1px var(--line)}
nav{display:flex;flex-direction:column;gap:1px}
.nav-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:0 0 9px 12px}
.nav-i{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 12px;border-radius:8px;font-size:14px;color:var(--muted);
  cursor:pointer;user-select:none;border:none;background:none;width:100%;
  font-family:var(--font-body);text-align:left;
}
.nav-i:hover{background:var(--sunk);color:var(--ink)}
.nav-i[aria-current=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-i .pend{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.rail-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
.rail-foot .eyebrow{overflow-wrap:anywhere;font-size:10px;line-height:1.6;letter-spacing:.08em}
.linkish{background:none;border:none;padding:0;color:var(--muted);font-size:13px;
  font-family:var(--font-body);cursor:pointer;text-decoration:underline}
.linkish:hover{color:var(--ink)}

main{overflow-y:auto}
.bar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:19px 34px;border-bottom:1px solid var(--line);
  background:var(--ground);position:sticky;top:0;z-index:10;
}
.bar h1{font-family:var(--font-display);font-size:15px;font-weight:600}
.chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);background:var(--surface);
  padding:5px 11px;border-radius:99px;white-space:nowrap}
.panel{display:none;padding:34px;max-width:1080px}
.panel.on{display:block}

/* ── SIGNATURE: the route card ────────────────────────────────────────
   A climbing project is a route you're working, not one you've failed.
   The setup state says exactly that, and it puts the one thing we're
   waiting on where they see it every time they sign in. ───────────── */
.route{
  background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:var(--radius);
  padding:28px 30px;margin-bottom:36px;
}
.route h2{font-family:var(--font-display);font-size:24px;font-weight:700;
  letter-spacing:-.02em;margin:9px 0 8px}
.route p.lede{color:var(--muted);max-width:62ch}
.steps{list-style:none;margin-top:26px;border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:30px 1fr auto;gap:16px;align-items:start;
  padding:16px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none;padding-bottom:2px}
.step .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:2px}
.step .t{font-family:var(--font-display);font-weight:600;font-size:15px}
.step .d{color:var(--muted);font-size:14px;margin-top:2px;max-width:56ch}
.state{font-family:var(--font-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:99px;white-space:nowrap;border:1px solid var(--line)}
.state.done{color:var(--ok);border-color:color-mix(in srgb,currentColor 38%,transparent);
  background:color-mix(in srgb,currentColor 9%,transparent)}
.state.wait{color:var(--wait);border-color:color-mix(in srgb,currentColor 42%,transparent);
  background:color-mix(in srgb,currentColor 11%,transparent)}
/* Scheduled ≠ blocked. Only the accent state should pull the eye, and only
   when the thing it marks is something the client has to do. */
.state.sched{color:var(--muted);border-color:color-mix(in srgb,currentColor 30%,transparent);
  background:transparent}

.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:13px}
.sec-h h3{font-family:var(--font-display);font-size:13px;font-weight:700;
  letter-spacing:.03em;text-transform:uppercase}
.sec-h span{font-size:13px;color:var(--muted)}
.hold{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px;display:flex;gap:16px;align-items:flex-start;
}
.hold .dot{width:9px;height:9px;border-radius:50%;background:var(--birch);margin-top:6px;flex:none}
.hold .h{font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:4px}
.hold .b{color:var(--muted);font-size:14px;max-width:60ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}

@media (max-width:820px){
  #app.on{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column}
  nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav-h{flex:1 1 100%;margin:0 0 2px 0}
  .nav-i{width:auto}
  .panel,.bar{padding-left:20px;padding-right:20px}
  .login-mark{font-size:42px}
  .route{padding:22px 20px}
}
@media (max-width:640px){
  /* Three columns can't hold a sentence on a phone. Reflow to two rows:
     marker and status on top, the actual content full width beneath. */
  .step{display:flex;flex-wrap:wrap;align-items:center;gap:9px 10px}
  .step .n{order:1;padding-top:0}
  .step .state{order:2;margin-left:auto}
  .step > div{order:3;flex:1 1 100%}
  .step .d{max-width:none}
  .sec-h{flex-direction:column;gap:3px}
}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
<section id="login">
  <div class="login-card">
    <p class="eyebrow">Competitive intelligence</p>
    <p class="wordmark login-mark">Scout</p>
    <p class="eyebrow">by Parallel Path</p>
    <div class="login-rule"></div>
    <p class="login-lede">Enter your email and we'll send you a link that signs you in. There's no password to set up.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@company.com">
      <div class="btn-row">
        <button type="submit" id="send">Email me a link</button>
      </div>
    </form>
    <div id="login-msg"></div>

    <div class="login-foot">
      <p class="eyebrow">We add each account by hand</p>
    </div>
  </div>
</section>

<!-- ── APP ───────────────────────────────────────────────────────────── -->
<div id="app">
  <aside class="rail">
    <div>
      <p class="wordmark rail-mark">Scout</p>
      <p class="rail-by">by Parallel Path</p>
    </div>

    <div class="rail-client">
      <div id="client-logo"></div>
      <p class="eyebrow">Prepared for</p>
      <div class="nm" id="client-name">—</div>
    </div>

    <nav id="nav" aria-label="Sections">
      <p class="nav-h">Intelligence</p>
    </nav>

    <div class="rail-foot">
      <p class="eyebrow" id="who">—</p>
      <button class="linkish" id="signout" style="margin-top:8px">Sign out</button>
    </div>
  </aside>

  <main>
    <div class="bar">
      <h1 id="panel-title">Overview</h1>
      <span class="chip" id="status-chip">Setting up</span>
    </div>
    <div id="panels"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONFIG
   The publishable key is safe in public source: it grants nothing on its
   own. Row level security is what protects the data, and it denies every
   request that isn't a signed-in user reading their own client's rows.
   ═══════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://mxcfinwrgvxrwoyzjhhs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GfXEXODcURNi7NLlg8htWg_xlcz-fGX';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Sections a client sees. Data Health is deliberately absent — collector
   status is our plumbing, and a failed scrape is our problem to fix, not
   a thing to show a client. */
const SECTIONS = [
  { id:'overview', label:'Overview',            title:'Overview' },
  { id:'search',   label:'Search Intelligence', title:'Search Intelligence' },
  { id:'paid',     label:'Paid Monitoring',     title:'Paid Monitoring' },
  { id:'social',   label:'Social Presence',     title:'Social Presence' },
  { id:'owned',    label:'Owned Channels',      title:'Owned Channels' },
];

/* What each section will carry once collection begins. Written for a reader
   who has never seen the tool: say what they'll get, not what we run. */
const PROMISE = {
  overview:[
    ['Competitive pressure','One score for how hard your competitors pushed this week, and which of them accounts for it.'],
    ['What changed','Ranked developments worth your attention, each traced back to what we observed.'],
    ['Where to act','One recommended action for each development.'],
  ],
  search:[
    ['Keyword movement','Which terms your competitors gained or lost, and where they are putting budget.'],
    ['Demand shifts','Search interest in your category and in each competitor by name.'],
  ],
  paid:[
    ['Live ad creative','The ads your competitors are running, and the message each one leads with.'],
    ['Spend signals','Where your competitors are concentrating budget, and where one has gone quiet.'],
  ],
  social:[
    ['Audience and cadence','How each competitor\'s following and posting rhythm changed.'],
    ['Content themes','What they post about, and the theme none of them has claimed.'],
  ],
  owned:[
    ['Website changes','Pricing, offers, and page changes on competitor sites, the week they happen.'],
    ['Email programs','What competitors send their members, and how often.'],
  ],
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function note(html, kind){ $('#login-msg').innerHTML = `<div class="msg ${kind}">${html}</div>`; }

/* ── Theme ──────────────────────────────────────────────────────────────
   The client's brand comes out of the database and onto :root. Any key the
   record omits keeps the fallback above, so a half-filled theme degrades
   into something legible instead of something broken. */
function applyTheme(theme){
  if(!theme || typeof theme !== 'object') return;
  const MAP = {
    ground:'--ground', surface:'--surface', sunk:'--sunk', ink:'--ink',
    muted:'--muted', line:'--line', birch:'--birch', accent:'--accent',
    accentSoft:'--accent-soft', ok:'--ok', wait:'--wait',
    fontDisplay:'--font-display', fontBody:'--font-body',
    fontMono:'--font-mono', radius:'--radius',
  };
  for(const [k, v] of Object.entries(MAP)){
    if(theme[k]) document.documentElement.style.setProperty(v, theme[k]);
  }
  if(theme.fontImport){
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = theme.fontImport;
    document.head.appendChild(l);
  }
}

/* ── Auth ─────────────────────────────────────────────────────────────── */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#email').value.trim();
  if(!email){ note('Enter the email address your invitation was sent to.','err'); return; }

  $('#send').disabled = true;
  $('#send').textContent = 'Sending…';

  const { error } = await sb.auth.signInWithOtp({
    email,
    options:{ emailRedirectTo: window.location.origin + window.location.pathname }
  });

  $('#send').disabled = false;
  $('#send').textContent = 'Email me a link';

  if(error){
    note("We couldn't send that link. Check the address and try again. If it keeps failing, reply to your invitation email.",'err');
    return;
  }
  /* Deliberately identical whether or not the address is authorized:
     a login screen should never confirm who has an account. */
  note(`If <strong>${esc(email)}</strong> has access, we've sent a sign-in link. It expires in an hour.`,'ok');
});

$('#signout').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.reload();
});

/* ── Boot ─────────────────────────────────────────────────────────────── */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#login').style.display='grid'; return; }

  /* One query, no client identifier sent. Row level security returns this
     user's client and nothing else — there is no parameter here for anyone
     to tamper with. */
  const { data:clients, error } = await sb
    .from('clients')
    .select('id,name,slug,theme,config,brain')
    .limit(1);

  if(error || !clients || clients.length === 0){
    $('#login').style.display='grid';
    note("You're signed in, but we haven't attached a dashboard to this account yet. Reply to your invitation and we'll finish the setup.",'err');
    return;
  }

  const client = clients[0];
  applyTheme(client.theme);

  const [{ count:compCount }, { data:briefs }] = await Promise.all([
    sb.from('competitors').select('id',{ count:'exact', head:true }),
    sb.from('briefings').select('id,week_of,pressure_score,summary')
      .order('week_of',{ ascending:false }).limit(1),
  ]);

  render(client, session, compCount || 0, (briefs && briefs[0]) || null);
}

function render(client, session, compCount, latest){
  $('#login').style.display = 'none';
  $('#app').classList.add('on');
  $('#client-name').textContent = client.name;
  $('#who').textContent = session.user.email;

  const logo = client.theme && client.theme.logoUrl;
  if(logo) $('#client-logo').innerHTML =
    `<img src="${esc(logo)}" alt="${esc(client.name)}" style="margin-top:8px">`;

  const cfg = client.config || {};
  const startsRaw = cfg.first_briefing_at || null;
  const starts = startsRaw
    ? new Date(startsRaw + 'T12:00:00Z').toLocaleDateString('en-US',
        { month:'long', day:'numeric', year:'numeric' })
    : null;

  const live = !!latest;
  $('#status-chip').textContent = live
    ? `Week of ${latest.week_of}`
    : (starts ? `Begins ${starts}` : 'Setting up');

  /* nav */
  const nav = $('#nav');
  SECTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'nav-i';
    b.type = 'button';
    b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
    b.innerHTML = `<span>${esc(s.label)}</span>`;
    b.addEventListener('click', () => show(s.id, b));
    nav.appendChild(b);
  });

  /* panels */
  const wrap = $('#panels');
  SECTIONS.forEach((s, i) => {
    const p = document.createElement('div');
    p.className = 'panel' + (i === 0 ? ' on' : '');
    p.id = 'panel-' + s.id;
    p.innerHTML = (i === 0 ? routeCard(client, compCount, starts) : '') + promiseBlocks(s.id, starts);
    wrap.appendChild(p);
  });
}

function show(id, btn){
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + id));
  document.querySelectorAll('.nav-i').forEach(b => b.setAttribute('aria-current', String(b === btn)));
  const s = SECTIONS.find(x => x.id === id);
  $('#panel-title').textContent = s ? s.title : '';
  document.querySelector('main').scrollTop = 0;
}

/* The setup card. Every row is derived from the database, so it stops
   saying "waiting" the moment the thing it's waiting on actually lands. */
function routeCard(client, compCount, starts){
  /* The seeded placeholder is longer than the length check, so test for it
     directly. A step that reports "Received" before anything arrived is worse
     than no step at all. */
  const brain = (client.brain || '').trim();
  const hasBrain = brain.length > 40 && !/^AWAITING/i.test(brain);
  const hasComps = compCount > 0;

  /* kind: 'done' settled · 'wait' the client owes us something · 'sched'
     on the calendar and nobody's blocked. Only 'wait' uses the accent. */
  const rows = [
    ['01','Access',
      "Your sign-in works. Tell us who else on your team needs one and we'll add them.",
      'done','Ready'],
    ['02','Your business context',
      "What you're trying to move this year, and what's in the way. We use it to turn observations into recommendations you can act on.",
      hasBrain ? 'done' : 'wait', hasBrain ? 'Received' : 'Waiting on you'],
    ['03','Competitors to watch',
      "The DC operators you compete with. Send us your list and we'll start there. If you'd rather we propose one, say so.",
      hasComps ? 'done' : 'wait', hasComps ? `${compCount} being monitored` : 'Waiting on you'],
    ['04','First briefing',
      starts ? `Collection starts and your first weekly briefing lands ${starts}.`
             : 'Collection starts once you send the competitor list. Briefings arrive every Monday after that.',
      'sched', starts || 'To be scheduled'],
  ];

  return `
  <div class="route">
    <p class="eyebrow">Setup</p>
    <h2>We're setting up your Scout</h2>
    <p class="lede">Scout watches your competitors every week and tells you what changed and what to do about it.</p>
    <ul class="steps">
      ${rows.map(([n, t, d, kind, label]) => `
        <li class="step">
          <span class="n">${n}</span>
          <div>
            <div class="t">${esc(t)}</div>
            <div class="d">${esc(d)}</div>
          </div>
          <span class="state ${kind}">${esc(label)}</span>
        </li>`).join('')}
    </ul>
  </div>`;
}

function promiseBlocks(id, starts){
  const items = PROMISE[id] || [];
  return `
  <div class="sec">
    <div class="sec-h">
      <h3>What you'll see here</h3>
      <span>${starts ? esc('First briefing ' + starts) : 'Once collection starts'}</span>
    </div>
    <div class="grid2">
      ${items.map(([h, b]) => `
        <div class="hold">
          <span class="dot"></span>
          <div><div class="h">${esc(h)}</div><div class="b">${esc(b)}</div></div>
        </div>`).join('')}
    </div>
  </div>`;
}

sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_IN') boot();
});
boot();
</script>
</body>
</html>
